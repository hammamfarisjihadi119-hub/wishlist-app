<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Wishlist Kami</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F5F0EB;
      color: #2D2D2D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      background: white;
      padding: 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-width: 360px;
      margin: 1rem;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #7C9A8C;
      margin-bottom: 0.5rem;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background-color: #7C9A8C;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(124, 154, 140, 0.3);
      transition: background 0.2s;
    }
    button:hover {
      background-color: #628072;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Sedang Offline</h1>
    <p>Koneksi internetmu sepertinya terputus. Buka kembali aplikasi setelah terhubung ke internet!</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
